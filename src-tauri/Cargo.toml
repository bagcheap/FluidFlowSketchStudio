[package]
name = "flowsketch"
version = "0.1.0"
description = "FlowSketch Studio as a desktop app"
edition = "2021"
publish = false

[lib]
name = "flowsketch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
